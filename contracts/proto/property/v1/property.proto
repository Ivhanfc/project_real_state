syntax = "proto3";

package property.v1;
import "google/protobuf/wrappers.proto";
import "google/protobuf/field_mask.proto";

option go_package = "project_real_state/contracts/gen/property/v1;propertyv1";


message PropertyImage {
    string imageID = 1;
    uint64 propertyID = 2;
    string url = 3;
    bool isCover = 4;
    int32 displayOrder = 5; 
}
message Property {
    uint64 id = 1;
    string agentID = 2;
    string name = 3;
    string description = 4;
    repeated PropertyImage property_image =  5;
    string address = 6;
    string zone = 7;
    int64  priceCents = 8;
    string currency = 9;
    bool   isAvailable = 10;
    double  sizeM2 = 11;

    oneof details {
      HouseDetails house = 12;
      ApartmentDetails apartment= 13;
      LandForSaleDetails land_for_sale = 14;
    }
}

message HouseDetails {
  int32 levels = 1;
  int32 bedrooms = 2;
  int32 bathrooms = 3;
}

message ApartmentDetails {
  int32 floor = 1;
  int32 rooms = 2;
}

message LandForSaleDetails {
  int32 quantityOfParcels = 1;
}
//Property Requests
message GetPropertyRequest {
  uint64 id = 1;
}
message AddPropertyRequest {
 Property property = 1;
}
message UpdatePropertyRequest {
  Property property = 1;
  google.protobuf.FieldMask update_mask = 2;
}

//Property Response data of request 
message GetPropertyResponse {
  Property property = 1;
}

message AddPropertyResponse {
  Property property = 1;
}


message UpdatePropertyResponse {
    Property property = 1;
}

service PropertyService {
  rpc GetProperty (GetPropertyRequest) returns (GetPropertyResponse);
  rpc AddProperty (AddPropertyRequest) returns (AddPropertyResponse);
  rpc DeleteProperty (GetPropertyRequest) returns (google.protobuf.BoolValue);
  rpc UpdateProperty(UpdatePropertyRequest) returns (UpdatePropertyResponse);
}